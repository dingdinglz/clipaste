[package]
name = "clipaste"
version = "2.6.1-dingdinglz.3"
edition = "2021"
description = "Bridge clipboard images and Markdown files to remote terminal AI tools"
license = "MIT"
repository = "https://github.com/dingdinglz/clipaste"

[dependencies]
image = { version = "0.25", default-features = false, features = ["tiff", "png", "bmp", "jpeg"] }
sha2 = "0.10.9"
# Authentication tokens must use the operating system CSPRNG, not timestamps.
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
# Process groups (Linux) and no-follow / ownership checks (all Unix hosts).
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSString",
    "NSURL",
    "NSData",
    "NSObject",
    "NSEnumerator",
    "NSRange",
    "NSRunLoop",
    "NSTimer",
    "NSDate",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSPasteboard",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
